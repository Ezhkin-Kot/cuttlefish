<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cuttlefish cam-test</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px monospace; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }
  #info { position: fixed; top: 8px; left: 8px; background: #000a; padding: 4px 8px; }
</style>
</head>
<body>
<div id="info">connecting...</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');
let frames = 0, bytes = 0, last = performance.now();

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'blob';
  ws.onopen = () => info.textContent = 'connected';
  ws.onclose = () => { info.textContent = 'disconnected, retrying...'; setTimeout(connect, 1000); };
  ws.onmessage = async (e) => {
    const bmp = await createImageBitmap(e.data);
    if (canvas.width !== bmp.width) { canvas.width = bmp.width; canvas.height = bmp.height; }
    ctx.drawImage(bmp, 0, 0);
    bmp.close();
    frames++; bytes += e.data.size;
    const now = performance.now();
    if (now - last >= 1000) {
      const s = (now - last) / 1000;
      info.textContent = `${canvas.width}x${canvas.height}  ${(frames / s).toFixed(1)} fps  ${(bytes * 8 / s / 1e6).toFixed(1)} Mbit/s`;
      frames = 0; bytes = 0; last = now;
    }
  };
}
connect();
</script>
</body>
</html>
